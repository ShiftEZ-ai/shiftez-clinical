name: Working policy
permissions:
  contents: read
jobs:
  policy:
    name: Working policy
    runs-on: ubuntu-24.04
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: refs/heads/dev
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Install the trusted pinned Python before parsing candidate syntax
      run: python3 .github/scripts/hosted_ci.py runtime --tool python
    - name: Enforce target policy without executing PR code
      env:
        POLICY_WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: python -I .github/scripts/working_policy.py guard
    - name: Retain policy findings for publisher label custody
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: policy-findings-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
        path: .run/policy/findings.json
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
'on':
  pull_request: null
  merge_group: null
