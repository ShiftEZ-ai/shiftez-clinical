name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.13.5'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  checks:
    name: Checks
    # Unset is disabled. Private repositories do not allocate hosted jobs.
    if: >-
      vars.HOSTED_CI_ENABLED == 'true' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      unit_count: ${{ steps.plan.outputs.unit_count }}
      browser_count: ${{ steps.plan.outputs.browser_count }}
      smoke: ${{ steps.plan.outputs.smoke }}
      replicas: ${{ steps.plan.outputs.replicas }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ${{ runner.temp }}/runtime-archives
          key: public-ci-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name }}-${{ hashFiles('requirements/*.lock', 'requirements/ci-runtimes.json', 'package-lock.json') }}
      - name: Install the committed runtime pins
        run: |
          python3 .github/scripts/hosted_ci.py runtime --tool python
          python3 .github/scripts/hosted_ci.py runtime --tool node
      - name: Install hash-locked dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/public-ci-venv"
          "$RUNNER_TEMP/public-ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock -r requirements/test.lock -r requirements/postgres.lock -r requirements/hosted-lint.lock
          echo "$RUNNER_TEMP/public-ci-venv/bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts
      - name: Lint
        run: |
          python -m ruff check --select F821,F822,F823 --output-format=concise .
          python scripts/check_web_permission_literals.py
          git show --format= --check HEAD
      - name: Typecheck
        run: npm run typecheck
      - name: Generated contracts
        run: python scripts/generate_contracts.py --check
      - name: Require exactly one migration head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          if len(heads) != 1:
              raise SystemExit('Exactly one migration head is required')
          print(heads[0])
          PY
      - name: Build web assets and compiled client modules
        run: |
          python scripts/build_web.py
          python scripts/compiled_client.py stamp
      - name: Plan all unit and browser files by committed duration
        id: plan
        env:
          UNIT_COUNT: ${{ vars.CI_UNIT_SHARDS || '25' }}
          BROWSER_COUNT: ${{ vars.CI_BROWSER_SHARDS || '18' }}
          SMOKE: ${{ vars.CI_SMOKE || 'false' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          UNSTABLE_LIMIT: ${{ vars.CI_UNSTABLE_LIMIT || '80' }}
          UNSTABLE_ISSUE: ${{ vars.CI_UNSTABLE_ISSUE }}
          UNSTABLE_EXPIRES_ON: ${{ vars.CI_UNSTABLE_EXPIRES_ON }}
        run: python .github/scripts/hosted_ci.py plan --unit-count "$UNIT_COUNT" --browser-count "$BROWSER_COUNT" --smoke "$SMOKE" --base-sha "$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-web-${{ github.run_attempt }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .run/reports/shard-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit (${{ matrix.shard }}/${{ needs.checks.outputs.unit_count }}, run ${{ matrix.replica }})
    needs: checks
    if: needs.checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.unit_matrix) }}
        replica: ${{ fromJSON(needs.checks.outputs.replicas) }}
    uses: ./.github/workflows/ci-tests.yml
    with:
      suite: unit
      shard: ${{ matrix.shard }}
      unit_count: ${{ needs.checks.outputs.unit_count }}
      browser_count: ${{ needs.checks.outputs.browser_count }}
      plan_sha256: ${{ needs.checks.outputs.plan_sha256 }}
      smoke: ${{ needs.checks.outputs.smoke }}
      replica: ${{ matrix.replica }}
      base_sha: ${{ needs.checks.outputs.base_sha }}

  browser:
    name: Browser (${{ matrix.shard }}/${{ needs.checks.outputs.browser_count }}, run ${{ matrix.replica }})
    needs: checks
    if: needs.checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.browser_matrix) }}
        replica: ${{ fromJSON(needs.checks.outputs.replicas) }}
    uses: ./.github/workflows/ci-tests.yml
    with:
      suite: browser
      shard: ${{ matrix.shard }}
      unit_count: ${{ needs.checks.outputs.unit_count }}
      browser_count: ${{ needs.checks.outputs.browser_count }}
      plan_sha256: ${{ needs.checks.outputs.plan_sha256 }}
      smoke: ${{ needs.checks.outputs.smoke }}
      replica: ${{ matrix.replica }}
      base_sha: ${{ needs.checks.outputs.base_sha }}

  result:
    name: CI result
    needs: [checks, unit, browser]
    if: >-
      always() && vars.HOSTED_CI_ENABLED == 'true' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every producer to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          if set(needs) != {'checks', 'unit', 'browser'} or any(row['result'] != 'success' for row in needs.values()):
              raise SystemExit('CI producer failed, cancelled, skipped or is missing: ' + str({name: row['result'] for name, row in needs.items()}))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .run/plan/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-test-${{ github.run_attempt }}-*
          path: .run/test-results/
      - name: Aggregate complete JUnits and build the baseline candidate
        env:
          BASE_SHA: ${{ needs.checks.outputs.base_sha }}
          UNSTABLE_LIMIT: ${{ vars.CI_UNSTABLE_LIMIT || '80' }}
          UNSTABLE_ISSUE: ${{ vars.CI_UNSTABLE_ISSUE || '0' }}
          UNSTABLE_EXPIRES_ON: ${{ vars.CI_UNSTABLE_EXPIRES_ON }}
        run: |
          python3 ci/make_known_failures.py --plan .run/plan/shard-plan.json --reports .run/test-results \
            --base-sha "$BASE_SHA" --unstable-limit "$UNSTABLE_LIMIT" --unstable-issue "$UNSTABLE_ISSUE" \
            --unstable-expires-on "$UNSTABLE_EXPIRES_ON"
      - name: Upload the candidate and aggregate verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: known-failures-candidate-${{ github.run_attempt }}
          path: .run/ratchet/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce the known-failures ratchet
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/hosted_ci.py result
