name: CI
permissions:
  contents: read
# Portfolio budget: 2 merge groups x 39 jobs + 1 dev cache warmer = 79.
# Delivery's admission lock counts building group jobs first and admits PR runs within the 41-job reserve.
# Manual pushes are rare and only from the owner account.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'ci-nightly' || format('ci-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHON_VERSION: 3.13.5
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  nightly-budget:
    name: Nightly capacity
    if: github.event_name == 'schedule' && vars.HOSTED_CI_ENABLED == 'true' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      admitted: ${{ steps.budget.outputs.admitted }}
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: refs/heads/dev
        path: .trusted-controls
        fetch-depth: 1
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Check available CI jobs
      id: budget
      working-directory: .
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -I .trusted-controls/.github/scripts/nightly_budget.py
  checks:
    name: Checks
    needs: nightly-budget
    if: >-
      always() && !cancelled() && vars.HOSTED_CI_ENABLED == 'true' && !github.event.repository.private
      && (github.event_name != 'schedule' || needs['nightly-budget'].result == 'success'
          && needs['nightly-budget'].outputs.admitted == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      bootstrap: ${{ steps.bootstrap.outputs.bootstrap }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      unit_count: ${{ steps.select.outputs.unit_count }}
      browser_count: ${{ steps.select.outputs.browser_count }}
      replicas: ${{ steps.plan.outputs.replicas }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      census_base_sha: ${{ steps.context.outputs.census_base_sha }}
      candidate_sha: ${{ steps.select.outputs.candidate_sha }}
      measurement: ${{ steps.select.outputs.measurement }}
      trusted_sha: ${{ steps.select.outputs.trusted_sha }}
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: refs/heads/dev
        path: .trusted-controls
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Detect bootstrap controls
      id: bootstrap
      working-directory: .
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if test -f .trusted-controls/.github/scripts/trusted_ci.py; then
          echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
        else
          test "$EVENT_NAME" = pull_request || { echo 'Bootstrap requires a pull request'; exit 1; }
          echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          echo 'TRUSTED_BOOTSTRAP=true' >> "$GITHUB_ENV"
          echo 'BOOTSTRAP: protected dev controls are absent; using the exact PR head'
        fi
    - name: Load initial controls from the exact PR head
      if: steps.bootstrap.outputs.bootstrap == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: .trusted-controls
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Select the exact candidate from protected configuration
      id: select
      working-directory: .
      run: python3 -I .trusted-controls/.github/scripts/trusted_ci.py select
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.select.outputs.candidate_sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Resolve target policy
      id: context
      run: python3 -I "$GITHUB_WORKSPACE/.trusted-controls/.github/scripts/trusted_ci.py" context --measurement "${{ steps.select.outputs.measurement }}"
    - name: README must remain empty, including the first root run
      run: python3 -I "$GITHUB_WORKSPACE/.trusted-controls/tests/test_readme_empty.py"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      id: dependency-cache
      with:
        path: |-
          ${{ runner.temp }}/public-ci-wheels
          ${{ runner.temp }}/public-ci-npm/_cacache
          ${{ runner.temp }}/runtime-archives

          ${{ runner.temp }}/public-ci-playwright
        key: public-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('candidate/requirements/*.lock', 'candidate/requirements/ci-runtimes.json', 'candidate/package-lock.json', '.trusted-controls/requirements/policy.lock') }}
    - name: Install the committed runtime pins
      run: |
        python3 .github/scripts/hosted_ci.py runtime --tool python
        python3 .github/scripts/hosted_ci.py runtime --tool node
    - name: Prepare the hash-locked wheel downloads
      env:
        CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      run: |
        wheels="$RUNNER_TEMP/public-ci-wheels"
        if [ "$CACHE_HIT" != true ]; then
          python3 -m venv "$RUNNER_TEMP/public-ci-venv"
          "$RUNNER_TEMP/public-ci-venv/bin/python" -m pip download --retries 3 --resume-retries 3 \
            --require-hashes --only-binary=:all: --dest "$wheels" \
            -r requirements/build.lock -r requirements/test.lock -r requirements/postgres.lock \
            -r "$GITHUB_WORKSPACE/.trusted-controls/requirements/policy.lock" -r requirements/hosted-lint.lock
        fi
        {
          printf 'PIP_NO_INDEX=1\nPIP_FIND_LINKS=%s\n' "$wheels"
          printf 'npm_config_prefer_offline=true\nnpm_config_cache=%s/public-ci-npm\n' "$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
    - name: Install hash-locked dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/public-ci-venv"
        "$RUNNER_TEMP/public-ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock -r requirements/test.lock -r requirements/postgres.lock -r "$GITHUB_WORKSPACE/.trusted-controls/requirements/policy.lock" -r requirements/hosted-lint.lock
        echo "$RUNNER_TEMP/public-ci-venv/bin" >> "$GITHUB_PATH"
        npm ci --ignore-scripts
    - name: Prepare the locked Chromium bundle
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-ci-playwright
      run: python -m playwright install --no-shell chromium
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.dependency-cache.outputs.cache-hit != 'true'
      with:
        path: |-
          ${{ runner.temp }}/public-ci-wheels
          ${{ runner.temp }}/public-ci-npm/_cacache
          ${{ runner.temp }}/runtime-archives

          ${{ runner.temp }}/public-ci-playwright
        key: public-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('candidate/requirements/*.lock', 'candidate/requirements/ci-runtimes.json', 'candidate/package-lock.json', '.trusted-controls/requirements/policy.lock') }}
    - name: Archive the shared downloads
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      run: |
        tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/ci-dependencies.tar" runtime-archives public-ci-wheels public-ci-npm/_cacache
        tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/ci-browser.tar" public-ci-playwright
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      with:
        name: ci-dependencies-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-dependencies.tar
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      with:
        name: ci-browser-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-browser.tar
        if-no-files-found: error
        retention-days: 1
    - name: Reject environment and status destination URLs
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      run: python -I "$GITHUB_WORKSPACE/.trusted-controls/.github/scripts/workflow_privacy.py" .github/workflows
    - name: Build web assets and compiled client modules
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      run: |
        python scripts/build_web.py
        python scripts/compiled_client.py stamp
    - name: Plan all unit and browser files by committed duration
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      id: plan
      env:
        BASE_SHA: ${{ steps.context.outputs.base_sha }}
        MEASUREMENT: ${{ steps.select.outputs.measurement }}
      run: python -I "$GITHUB_WORKSPACE/.trusted-controls/.github/scripts/trusted_ci.py" plan --base-sha "$BASE_SHA" --measurement "$MEASUREMENT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      with:
        name: ci-web-${{ github.run_attempt }}
        path: candidate/apps/web/dist/
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      with:
        name: ci-plan-${{ github.run_attempt }}
        path: candidate/.run/reports/shard-plan.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  unit:
    name: Unit (${{ matrix.shard }}/${{ needs.checks.outputs.unit_count }}, run ${{ matrix.replica }})
    needs: checks
    if: >-
      always() && !cancelled() && needs.checks.result == 'success'
      && (github.event_name != 'push' || github.ref != 'refs/heads/dev')
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'merge_group' && 17 || github.event_name == 'schedule' && 8 || 10 }}
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.unit_matrix) }}
        replica: ${{ fromJSON(needs.checks.outputs.replicas) }}
    uses: ./.github/workflows/ci-tests.yml
    with:
      suite: unit
      shard: ${{ matrix.shard }}
      unit_count: ${{ needs.checks.outputs.unit_count }}
      browser_count: ${{ needs.checks.outputs.browser_count }}
      plan_sha256: ${{ needs.checks.outputs.plan_sha256 }}
      replica: ${{ matrix.replica }}
      base_sha: ${{ needs.checks.outputs.base_sha }}
      census_base_sha: ${{ needs.checks.outputs.census_base_sha }}
      candidate_sha: ${{ needs.checks.outputs.candidate_sha }}
      measurement: ${{ needs.checks.outputs.measurement }}
      trusted_sha: ${{ needs.checks.outputs.trusted_sha }}
      bootstrap: ${{ needs.checks.outputs.bootstrap }}
  browser:
    name: Browser (${{ matrix.shard }}/${{ needs.checks.outputs.browser_count }}, run ${{ matrix.replica }})
    needs: checks
    if: >-
      always() && !cancelled() && needs.checks.result == 'success'
      && (github.event_name != 'push' || github.ref != 'refs/heads/dev')
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'merge_group' && 20 || github.event_name == 'schedule' && 10 || 8 }}
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.browser_matrix) }}
        replica: ${{ fromJSON(needs.checks.outputs.replicas) }}
    uses: ./.github/workflows/ci-tests.yml
    with:
      suite: browser
      shard: ${{ matrix.shard }}
      unit_count: ${{ needs.checks.outputs.unit_count }}
      browser_count: ${{ needs.checks.outputs.browser_count }}
      plan_sha256: ${{ needs.checks.outputs.plan_sha256 }}
      replica: ${{ matrix.replica }}
      base_sha: ${{ needs.checks.outputs.base_sha }}
      census_base_sha: ${{ needs.checks.outputs.census_base_sha }}
      candidate_sha: ${{ needs.checks.outputs.candidate_sha }}
      measurement: ${{ needs.checks.outputs.measurement }}
      trusted_sha: ${{ needs.checks.outputs.trusted_sha }}
      bootstrap: ${{ needs.checks.outputs.bootstrap }}
  result:
    name: CI result
    env:
      TRUSTED_BOOTSTRAP: ${{ needs.checks.outputs.bootstrap }}
    needs:
    - checks
    - static
    - unit
    - browser
    if: >-
      always() && (github.event_name != 'push' || github.ref != 'refs/heads/dev')
      && (github.event_name != 'schedule' || needs.checks.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - name: Every selected producer must run and succeed
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |-
        python3 -I - <<'PY'
        import json, os
        needs=json.loads(os.environ['NEEDS_JSON'])
        if set(needs)!={'checks','static','unit','browser'} or any(r.get('result')!='success' for r in needs.values()):
            raise SystemExit('CI producer failed, cancelled, skipped or missing')
        PY
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.checks.outputs.trusted_sha }}
        path: .trusted-verdict
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ci-plan-${{ github.run_attempt }}
        path: .candidate-evidence/plan
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: ci-test-${{ github.run_attempt }}-*
        path: .candidate-evidence/test-results
    - name: Trusted source/node/canary/allowance verdict
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
        CANDIDATE_SHA: ${{ needs.checks.outputs.candidate_sha }}
        MEASUREMENT: ${{ needs.checks.outputs.measurement }}
        UNIT_COUNT: ${{ needs.checks.outputs.unit_count }}
        BROWSER_COUNT: ${{ needs.checks.outputs.browser_count }}
      run: |
        python3 -I -c 'import hashlib,json,os,pathlib; plan=json.loads(pathlib.Path(".candidate-evidence/plan/shard-plan.json").read_bytes()); seal=hashlib.sha256(json.dumps(plan,sort_keys=True,separators=(",",":")).encode()).hexdigest(); assert seal==json.loads(os.environ["NEEDS_JSON"])["checks"]["outputs"]["plan_sha256"], "Plan seal differs from Checks"; print("Plan",seal,"tree="+plan["tree"])'
        python3 -I .trusted-verdict/.github/scripts/trusted_verdict.py --plan .candidate-evidence/plan/shard-plan.json --reports .candidate-evidence/test-results --output .run/ratchet
    - name: Keep raw measurement or qualification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: known-failures-candidate-${{ github.run_attempt }}
        path: .run/ratchet/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
  static:
    name: Static checks
    needs: checks
    if: >-
      always() && !cancelled() && needs.checks.result == 'success'
      && vars.HOSTED_CI_ENABLED == 'true' && !github.event.repository.private
      && (github.event_name != 'push' || github.ref != 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.checks.outputs.trusted_sha }}
        path: .trusted-controls
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Detect bootstrap controls
      id: bootstrap
      working-directory: .
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if test -f .trusted-controls/.github/scripts/trusted_ci.py; then
          echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
        else
          test "$EVENT_NAME" = pull_request || { echo 'Bootstrap requires a pull request'; exit 1; }
          echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          echo 'TRUSTED_BOOTSTRAP=true' >> "$GITHUB_ENV"
          echo 'BOOTSTRAP: protected dev controls are absent; using the exact PR head'
        fi
    - name: Load initial controls from the exact PR head
      if: steps.bootstrap.outputs.bootstrap == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: .trusted-controls
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Select the exact candidate from protected configuration
      id: select
      working-directory: .
      run: python3 -I .trusted-controls/.github/scripts/trusted_ci.py select
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.select.outputs.candidate_sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ci-dependencies-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hosted-shared
    - name: Use the shared hash-locked package downloads
      run: |
        tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/hosted-shared/ci-dependencies.tar"
        {
          printf 'PIP_NO_INDEX=1\nPIP_FIND_LINKS=%s/public-ci-wheels\n' "$RUNNER_TEMP"
          printf 'npm_config_offline=true\nnpm_config_cache=%s/public-ci-npm\n' "$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
    - name: Install the committed runtime pins
      run: |
        python3 .github/scripts/hosted_ci.py runtime --tool python
        python3 .github/scripts/hosted_ci.py runtime --tool node
    - name: Install hash-locked dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/public-ci-venv"
        "$RUNNER_TEMP/public-ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock -r requirements/test.lock -r requirements/postgres.lock -r "$GITHUB_WORKSPACE/.trusted-controls/requirements/policy.lock" -r requirements/hosted-lint.lock
        echo "$RUNNER_TEMP/public-ci-venv/bin" >> "$GITHUB_PATH"
        npm ci --ignore-scripts
    - name: Lint
      run: |
        python -m ruff check --select F821,F822,F823 --output-format=concise .
        python scripts/check_web_permission_literals.py
        git show --format= --check HEAD
    - name: Typecheck
      run: npm run typecheck
    - name: Generated contracts
      run: python scripts/generate_contracts.py --check
    - name: Require exactly one migration head
      run: |
        python - <<'PY'
        from alembic.config import Config
        from alembic.script import ScriptDirectory
        heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
        if len(heads) != 1:
            raise SystemExit('Exactly one migration head is required')
        print(heads[0])
        PY
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  merge_group:
    types:
    - checks_requested
  workflow_dispatch: {}
  push:
    branches:
    - preview
    - dev
defaults:
  run:
    working-directory: candidate
