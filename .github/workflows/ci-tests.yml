name: CI tests
permissions:
  contents: read
jobs:
  tests:
    name: ${{ inputs.suite }}
    if: vars.HOSTED_CI_ENABLED == 'true' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRUSTED_BOOTSTRAP: ${{ inputs.bootstrap }}
      ROTA_ALLOW_DISPOSABLE_TEST_DB: 'yes'
      ROTA_ALLOW_TEST_ROLES: 'yes'
      PW_TRACE_DIR: .run/traces
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SUITE: ${{ inputs.suite }}
      CI_UNIT_WORKERS: ${{ vars.CI_UNIT_WORKERS }}
      CI_BROWSER_WORKERS: ${{ vars.CI_BROWSER_WORKERS }}
      SHARD_INDEX: ${{ inputs.shard }}
      UNIT_COUNT: ${{ inputs.unit_count }}
      BROWSER_COUNT: ${{ inputs.browser_count }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      REPLICA: ${{ inputs.replica }}
      BASE_SHA: ${{ inputs.base_sha }}
      CENSUS_BASE_DIR: ${{ github.workspace }}/.base-census
      CENSUS_BASE_SHA: ${{ inputs.census_base_sha }}
      MEASUREMENT: ${{ inputs.measurement }}
    services:
      postgres:
        image: postgres@sha256:41687100ce9a867948d534c52252b4f3edaf3222fcbbc6b46b7bb5a3be4577bb
        env:
          POSTGRES_DB: rota_disposable_test
          POSTGRES_USER: rota_test
          POSTGRES_PASSWORD: ephemeral-ci-only-password
        ports:
        - 5432/tcp
        options: --tmpfs /var/lib/postgresql/data --health-cmd "pg_isready -U rota_test -d rota_disposable_test" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - name: Validate the Checks artifact attempt
      working-directory: .
      env:
        ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
      run: |
        case "$ARTIFACT_ATTEMPT" in
          ''|*[!0-9]*) echo 'Invalid Checks artifact attempt'; exit 1 ;;
        esac
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.trusted_sha }}
        path: .trusted-controls
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Detect bootstrap controls
      id: bootstrap
      working-directory: .
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if test -f .trusted-controls/.github/scripts/trusted_ci.py; then
          echo 'bootstrap=false' >> "$GITHUB_OUTPUT"
        else
          test "$EVENT_NAME" = pull_request || { echo 'Bootstrap requires a pull request'; exit 1; }
          echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          echo 'TRUSTED_BOOTSTRAP=true' >> "$GITHUB_ENV"
          echo 'BOOTSTRAP: protected dev controls are absent; using the exact PR head'
        fi
    - name: Load initial controls from the exact PR head
      if: steps.bootstrap.outputs.bootstrap == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: .trusted-controls
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.candidate_sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.census_base_sha }}
        path: .base-census
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ci-dependencies-${{ inputs.artifact_attempt }}
        path: ${{ runner.temp }}/hosted-shared
    - name: Use the shared hash-locked package downloads
      run: |
        tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/hosted-shared/ci-dependencies.tar"
        {
          printf 'PIP_NO_INDEX=1\nPIP_FIND_LINKS=%s/public-ci-wheels\n' "$RUNNER_TEMP"
          printf 'npm_config_offline=true\nnpm_config_cache=%s/public-ci-npm\n' "$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
    - name: Install the committed runtime pins
      env:
        PG_PORT: ${{ job.services.postgres.ports['5432'] }}
      run: |
        python3 .github/scripts/hosted_ci.py runtime --tool python
        python3 .github/scripts/hosted_ci.py runtime --tool node
        echo "TEST_POSTGRES_URL=postgresql+psycopg://rota_test:ephemeral-ci-only-password@127.0.0.1:$PG_PORT/rota_disposable_test" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/public-ci-playwright" >> "$GITHUB_ENV"
    - name: Install hash-locked dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/public-ci-venv"
        "$RUNNER_TEMP/public-ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock -r requirements/test.lock -r requirements/postgres.lock -r "$GITHUB_WORKSPACE/.trusted-controls/requirements/policy.lock"
        echo "$RUNNER_TEMP/public-ci-venv/bin" >> "$GITHUB_PATH"
        npm ci --ignore-scripts
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: inputs.suite == 'browser'
      with:
        name: ci-browser-${{ inputs.artifact_attempt }}
        path: ${{ runner.temp }}/hosted-shared
    - name: Restore the locked Chromium and install system dependencies
      if: inputs.suite == 'browser'
      run: |
        tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/hosted-shared/ci-browser.tar"
        apt_bundle="$RUNNER_TEMP/public-ci-apt"
        recorded_image=$(cat "$apt_bundle/image-version" 2>/dev/null || true)
        shopt -s nullglob
        debs=("$apt_bundle"/*.deb)
        shopt -u nullglob
        if [ -z "${ImageVersion:-}" ] || [ "$recorded_image" != "$ImageVersion" ]; then
          fallback_reason='image version mismatch'
        elif [ "${#debs[@]}" -eq 0 ]; then
          fallback_reason='empty set'
        elif sudo dpkg -i "${debs[@]}" && sudo dpkg --configure -a; then
          printf '::notice::browser system packages: offline (%s debs, image %s)\n' "${#debs[@]}" "$ImageVersion"
          exit 0
        else
          fallback_reason='dpkg failed'
        fi
        printf '::warning::browser system packages: fallback (%s)\n' "$fallback_reason"
        # A stalled package mirror once held this step to the 60-min job limit. Measured over 8,858 runs:
        # p99.9 81 s, max 319 s, so each attempt gets 600 s and apt retries its own requests.
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
        for attempt in 1 2 3; do
          # A killed attempt can leave its apt-get child holding the apt lock and dpkg half-configured:
          # stop the leftovers and repair dpkg, so the retry fails only on the mirror.
          if [ "$attempt" != 1 ]; then sudo pkill -KILL -x apt-get || true; sudo pkill -KILL -x dpkg || true; sudo dpkg --configure -a || true; fi
          timeout --kill-after=30 600 python -m playwright install-deps chromium && break
          if [ "$attempt" = 3 ]; then echo "Browser system dependencies did not install in 3 attempts"; exit 1; fi
          echo "::warning::Browser system dependency install attempt $attempt failed or stalled; retrying"
        done
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ci-web-${{ inputs.artifact_attempt }}
        path: candidate/apps/web/dist/
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      id: shard-plan
      if: github.event_name == 'pull_request' && inputs.bootstrap != 'true' && (inputs.suite != 'unit' || inputs.shard != 1)
      with:
        name: ci-plan-${{ inputs.artifact_attempt }}
        path: ${{ runner.temp }}/checks-plan
    - name: Check Postgres and retain runner/setup evidence
      env:
        PG_CONTAINER: ${{ job.services.postgres.id }}
        HOSTED_KIND: ${{ runner.environment }}
      run: |
        mkdir -p .run/reports
        python - <<'PY'
        import json, os, platform, time
        from pathlib import Path
        import psycopg
        started = time.monotonic()
        dsn = os.environ['TEST_POSTGRES_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
        with psycopg.connect(dsn, connect_timeout=15) as db:
            connections = db.execute('SHOW max_connections').fetchone()[0]
            if int(connections) < 100:
                raise SystemExit('Postgres requires max_connections >= 100')
            if not db.execute('SELECT rolcreatedb OR rolsuper FROM pg_roles WHERE rolname = current_user').fetchone()[0]:
                raise SystemExit('Postgres must allow disposable worker databases')
        evidence = {'runner_environment': os.environ['HOSTED_KIND'], 'cpu': os.cpu_count(),
                    'platform': platform.platform(), 'postgres_connect_seconds': time.monotonic() - started,
                    'postgres_max_connections': int(connections), 'meminfo': Path('/proc/meminfo').read_text()}
        Path('.run/reports/setup.json').write_text(json.dumps(evidence, indent=2) + '\n')
        PY
        ( while :; do date +%s; cat /proc/loadavg; head -1 /proc/stat; cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory 2>/dev/null; sleep 15; done > .run/reports/cpu-samples.txt 2>&1 & )
        echo "CI_POSTGRES_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
        python scripts/compiled_client.py
    - name: Run the exact planned shard once
      env:
        CI_CHECKS_PLAN: ${{ steps.shard-plan.outcome == 'success' && format('{0}/checks-plan/shard-plan.json', runner.temp) || '' }}
      run: python -I "$GITHUB_WORKSPACE/.trusted-controls/.github/scripts/trusted_ci.py" run --suite "$SUITE" --shard "$SHARD_INDEX" --replica "$REPLICA" --base-sha "$BASE_SHA" --plan-sha256 "$PLAN_SHA256" --measurement "$MEASUREMENT"
    - name: Retain first-attempt reports and failure evidence
      id: evidence
      if: always()
      # A transient artifact-service timeout must not discard a finished shard; the next step retries once.
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-test-${{ github.run_attempt }}-${{ inputs.suite }}-${{ inputs.shard }}-${{ inputs.replica }}
        path: |-
          candidate/.run/reports/
          candidate/.run/traces/
          candidate/.run/api-logs/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - name: Retry the evidence upload once
      if: always() && steps.evidence.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-test-${{ github.run_attempt }}-${{ inputs.suite }}-${{ inputs.shard }}-${{ inputs.replica }}
        path: |-
          candidate/.run/reports/
          candidate/.run/traces/
          candidate/.run/api-logs/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        overwrite: true
'on':
  workflow_call:
    inputs:
      bootstrap:
        type: string
        required: true
      artifact_attempt:
        type: string
        required: true
      suite:
        type: string
        required: true
      shard:
        type: number
        required: true
      unit_count:
        type: string
        required: true
      browser_count:
        type: string
        required: true
      plan_sha256:
        type: string
        required: true
      replica:
        type: number
        required: true
      base_sha:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true
      measurement:
        type: string
        required: true
      trusted_sha:
        type: string
        required: true
      census_base_sha:
        type: string
        required: true
defaults:
  run:
    working-directory: candidate
