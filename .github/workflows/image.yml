name: Image
permissions:
  contents: read
concurrency:
  # A pending build for one commit must survive a push of a different commit.
  group: image-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    # Generous until the first runs are measured; then set from the measured time plus margin.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      public-digest: ${{ steps.public_push.outputs.digest }}
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Build and scan the image
      id: scan
      env:
        COMMIT: ${{ github.sha }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        base=$(sed -n 's/^ARG PYTHON_IMAGE=//p' infra/Dockerfile)
        [[ "$base" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || { echo "No pinned runtime base"; exit 1; }
        base_config="$RUNNER_TEMP/image-base.json"
        docker buildx imagetools inspect --format '{{json (index .Image "linux/amd64")}}' "$base" > "$base_config"
        archive="$RUNNER_TEMP/image.tar"
        iid="$RUNNER_TEMP/image-id"
        docker buildx create --use --name publish >/dev/null
        docker buildx build --file infra/Dockerfile --platform linux/amd64 --provenance=false \
          --output "type=docker,dest=$archive" --iidfile "$iid" \
          --build-arg PUBLIC_IMAGE=1 \
          --build-arg ROTA_BUILD_COMMIT="$COMMIT" \
          --build-arg ROTA_BUILD_DATE="$(git log -1 --format=%cI "$COMMIT")" \
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label org.opencontainers.image.revision="$COMMIT" .
        image_id=$(cat "$iid")
        python3 scripts/scan_public_image.py "$archive" "$base_config" "$image_id"
        docker image load --quiet --input "$archive"
        echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
        echo "public-image=ghcr.io/${GITHUB_REPOSITORY,,}-public" >> "$GITHUB_OUTPUT"
        public_tag="dev-${COMMIT:0:12}"
        # A version tag publishes its public image under the same tag, so a receiver can pull and verify it.
        if [[ "$REF_TYPE" == tag ]]; then public_tag="$REF_NAME"; fi
        echo "public-tag=$public_tag" >> "$GITHUB_OUTPUT"
    - name: Log in to the image registry
      if: steps.scan.outcome == 'success'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Push and inspect the scanned image
      id: push
      if: steps.scan.outcome == 'success'
      env:
        IMAGE_ID: ${{ steps.scan.outputs.image-id }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        case "$REF_TYPE/$REF_NAME" in
          tag/v*) tags=("$image:$REF_NAME") ;;
          # The default branch keeps the dev and dev-<sha12> tag names whatever it is called; unset refuses.
          "branch/${DEFAULT_BRANCH:?}") tags=("$image:dev" "$image:dev-${COMMIT:0:12}") ;;
          *) echo "Only the default branch and v* tags publish an image"; exit 1 ;;
        esac
        digest=''
        for ref in "${tags[@]}"; do
          docker image tag "$IMAGE_ID" "$ref"
          pushed=$(docker push "$ref" | awk -v tag="${ref##*:}:" '$1 == tag && $2 == "digest:" { print $3 }')
          [[ "$pushed" =~ ^sha256:[0-9a-f]{64}$ && "$pushed" == "${digest:-$pushed}" ]] || { echo "Invalid or inconsistent image digest"; exit 1; }
          digest="$pushed"
        done
        config_digest=$(docker buildx imagetools inspect --raw "$image@$digest" | jq -er '.config.digest')
        [[ "$config_digest" == "$IMAGE_ID" ]] || { echo "Image config differs from scan"; exit 1; }
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Image \`$image@$digest\` for \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Push and inspect the scanned public image
      id: public_push
      # Runs only after the push step accepted the ref: the default branch or a v* tag.
      if: steps.scan.outcome == 'success'
      env:
        IMAGE: ${{ steps.scan.outputs.public-image }}
        TAG: ${{ steps.scan.outputs.public-tag }}
        IMAGE_ID: ${{ steps.scan.outputs.image-id }}
      run: |
        set -euo pipefail
        docker image tag "$IMAGE_ID" "$IMAGE:$TAG"
        digest=$(docker push "$IMAGE:$TAG" | awk -v tag="$TAG:" '$1 == tag && $2 == "digest:" { print $3 }')
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No public image digest"; exit 1; }
        config_digest=$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -er '.config.digest')
        [[ "$config_digest" == "$IMAGE_ID" ]] || { echo "Public image config differs from scan"; exit 1; }
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Public image \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Attest the public image digest
      if: steps.public_push.outcome == 'success'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.scan.outputs.public-image }}
        subject-digest: ${{ steps.public_push.outputs.digest }}
        push-to-registry: true
        create-storage-record: false
'on':
  push:
    branches:
    - main
    tags:
    - v*
