name: Image
permissions:
  contents: read
concurrency:
  # A pending build for one commit must survive a push of a different commit.
  group: image-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    # Generous until the first runs are measured; then set from the measured time plus margin.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest || steps.public_push.outputs.digest }}
      public-digest: ${{ github.ref == 'refs/heads/main' && steps.public_push.outputs.digest || '' }}
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Create image builder
      run: docker buildx create --use --name publish >/dev/null
    - name: Build and push the main image by digest
      id: push
      if: github.ref == 'refs/heads/main'
      env:
        REGISTRY_TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
        COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        docker buildx build --file infra/Dockerfile --push --tag "$image:dev" --tag "$image:dev-${COMMIT:0:12}" \
          --build-arg ROTA_BUILD_COMMIT="$COMMIT" \
          --build-arg ROTA_BUILD_DATE="$(git log -1 --format=%cI "$COMMIT")" \
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label org.opencontainers.image.revision="$COMMIT" \
          --metadata-file "$RUNNER_TEMP/metadata.json" .
        digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/metadata.json")
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No image digest"; exit 1; }
        docker buildx imagetools inspect "$image@$digest" >/dev/null
        docker logout ghcr.io
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Image \`$image@$digest\` for \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Check whether the image scanner is available
      id: scanner
      working-directory: scripts
      env:
        REF_TYPE: ${{ github.ref_type }}
      run: |
        if [[ -f privacy_check.py ]]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        elif [[ "$REF_TYPE" == tag ]]; then
          echo 'Tagged images require a privacy scanner.'
          exit 1
        else
          echo 'Public image publication skipped because the privacy scanner is unavailable.' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Build and scan the image
      id: public_scan
      if: steps.scanner.outputs.available == 'true'
      env:
        COMMIT: ${{ github.sha }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        if [[ "$REF_TYPE" == tag ]]; then
          tag="$REF_NAME"
        else
          image+="-public"
          tag="dev-${COMMIT:0:12}"
        fi
        base=$(sed -n 's/^ARG PYTHON_IMAGE=//p' infra/Dockerfile)
        [[ "$base" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || { echo "No pinned runtime base"; exit 1; }
        base_config="$RUNNER_TEMP/public-base.json"
        docker buildx imagetools inspect --format '{{json (index .Image "linux/amd64")}}' "$base" > "$base_config"
        docker buildx build --file infra/Dockerfile --load --provenance=false --platform linux/amd64 --tag "$image:$tag" \
          --build-arg PUBLIC_IMAGE=1 \
          --build-arg ROTA_BUILD_COMMIT="$COMMIT" \
          --build-arg ROTA_BUILD_DATE="$(git log -1 --format=%cI "$COMMIT")" \
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label org.opencontainers.image.revision="$COMMIT" .
        archive="$RUNNER_TEMP/public-image.tar"
        image_id=$(docker image inspect --format '{{.Id}}' "$image:$tag")
        docker image save --output "$archive" "$image:$tag"
        python3 scripts/scan_public_image.py "$archive" "$base_config" "$image_id"
        echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Log in to the image registry
      if: steps.public_scan.outcome == 'success'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Push and inspect the scanned image
      id: public_push
      if: steps.public_scan.outcome == 'success'
      env:
        IMAGE: ${{ steps.public_scan.outputs.image }}
        TAG: ${{ steps.public_scan.outputs.tag }}
        IMAGE_ID: ${{ steps.public_scan.outputs.image-id }}
      run: |
        set -euo pipefail
        digest=$(docker push "$IMAGE:$TAG" | awk -v tag="$TAG:" '$1 == tag && $2 == "digest:" { print $3 }')
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No scanned image digest"; exit 1; }
        config_digest=$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -er '.config.digest')
        [[ "$config_digest" == "$IMAGE_ID" ]] || { echo "Published image config differs from scan"; exit 1; }
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Public image \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Attest the public image digest
      if: github.ref == 'refs/heads/main' && steps.public_push.outcome == 'success'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.public_scan.outputs.image }}
        subject-digest: ${{ steps.public_push.outputs.digest }}
        push-to-registry: true
        create-storage-record: false
'on':
  push:
    branches:
    - main
    tags:
    - v*
