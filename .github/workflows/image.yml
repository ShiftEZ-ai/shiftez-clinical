name: Image
permissions:
  contents: read
concurrency:
  # A pending build for one commit must survive a push of a different commit.
  group: image-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    # Generous until the first runs are measured; then set from the measured time plus margin.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      public-digest: ${{ steps.public_push.outputs.digest }}
    steps:
    - name: Require GitHub-hosted execution
      env:
        HOSTED_KIND: ${{ runner.environment }}
      working-directory: .
      run: test "$HOSTED_KIND" = "github-hosted" || { echo "GitHub-hosted runner required"; exit 1; }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Build and push by digest
      id: push
      env:
        REGISTRY_TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        case "$REF_TYPE/$REF_NAME" in
          tag/v*) tags=(--tag "$image:$REF_NAME") ;;
          # The default branch keeps the dev and dev-<sha12> tag names whatever it is called; unset refuses.
          "branch/${DEFAULT_BRANCH:?}") tags=(--tag "$image:dev" --tag "$image:dev-${COMMIT:0:12}") ;;
          *) echo "Only the default branch and v* tags publish an image"; exit 1 ;;
        esac
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        docker buildx create --use --name publish >/dev/null
        docker buildx build --file infra/Dockerfile --push "${tags[@]}" \
          --build-arg ROTA_BUILD_COMMIT="$COMMIT" \
          --build-arg ROTA_BUILD_DATE="$(git log -1 --format=%cI "$COMMIT")" \
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label org.opencontainers.image.revision="$COMMIT" \
          --metadata-file "$RUNNER_TEMP/metadata.json" .
        digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/metadata.json")
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No image digest"; exit 1; }
        docker buildx imagetools inspect "$image@$digest" >/dev/null
        docker logout ghcr.io
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Image \`$image@$digest\` for \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Check whether the public image scanner is available
      id: scanner
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      working-directory: scripts
      run: |
        if [[ -f privacy_check.py ]]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'Public image publication skipped because the privacy scanner is unavailable.' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Build and scan the public image
      id: public_scan
      if: steps.scanner.outputs.available == 'true'
      env:
        COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}-public"
        tag="dev-${COMMIT:0:12}"
        docker buildx build --file infra/Dockerfile --load --provenance=false --tag "$image:$tag" \
          --build-arg ROTA_BUILD_COMMIT="$COMMIT" \
          --build-arg ROTA_BUILD_DATE="$(git log -1 --format=%cI "$COMMIT")" \
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label org.opencontainers.image.revision="$COMMIT" .
        archive="$RUNNER_TEMP/public-image.tar"
        docker image save --output "$archive" "$image:$tag"
        python3 scripts/scan_public_image.py "$archive"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Log in to the public image registry
      if: steps.public_scan.outcome == 'success'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Push and inspect the scanned public image
      id: public_push
      if: steps.public_scan.outcome == 'success'
      env:
        IMAGE: ${{ steps.public_scan.outputs.image }}
        TAG: ${{ steps.public_scan.outputs.tag }}
      run: |
        set -euo pipefail
        digest=$(docker push "$IMAGE:$TAG" | awk -v tag="$TAG:" '$1 == tag && $2 == "digest:" { print $3 }')
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No public image digest"; exit 1; }
        docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Public image \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Attest the public image digest
      if: steps.public_push.outcome == 'success'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.public_scan.outputs.image }}
        subject-digest: ${{ steps.public_push.outputs.digest }}
        push-to-registry: true
        create-storage-record: false
'on':
  push:
    branches:
    # shortcut: dev is removed after the default branch is renamed to main.
    - dev
    - main
    tags:
    - v*
